name: Plugin checks
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/loop-proxy-dsh/package-lock.json
      - run: npm run bootstrap
      - run: npm run check
      - run: npm test
