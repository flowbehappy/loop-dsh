- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    publicUrl: !!js process.env.DSH_LOOP_PROXY_WORKSITE_URL || ctx.webStartup.publicUrl
    surfaceContext: true
- id: connection
  config:
    trustedHosts: !!js "process.env.DSH_LOOP_PROXY_WORKSITE_TRUSTED_HOST ? [process.env.DSH_LOOP_PROXY_WORKSITE_TRUSTED_HOST, ...ctx.webStartup.trustedHosts] : ctx.webStartup.trustedHosts"
- insert:
    - id: loop-managed-config
      name: '@pingkai/loop-dsh/managed-config'
    - id: loop-proxy-dsh
      name: '@pingkai/loop-dsh'
      inject: [loopManagedConfig]
    - id: loop-proxy-dsh-host
      name: '@pingkai/loop-dsh/host-service'
      inject: [loopManagedConfig]
      config:
        stateHome: !!js ctx.loopManagedConfig.stateHome
        workerRoot: !!js ctx.loopManagedConfig.workerRoot
    - id: loop-managed-actions
      name: '@pingkai/loop-dsh/managed-actions'
    - id: loop-proxy-dsh-models
      name: '@pingkai/loop-dsh/host-models'
    - id: loop-proxy-dsh-worksite
      name: '@pingkai/loop-dsh/host-worksite'
      inject: [loopManagedConfig]
      disabled: !!js "!process.env.DSH_LOOP_PROXY_WORKSITE_URL"
      config:
        worksiteUrl: !!js process.env.DSH_LOOP_PROXY_WORKSITE_URL
        hostKind: !!js ctx.loopManagedConfig.kind
    - id: loop-proxy-dsh-sync
      name: '@pingkai/loop-dsh/sync'
      inject: [loopManagedConfig, loopNativeSyncWriterFactory]
      config:
        workspaceRoot: !!js ctx.loopManagedConfig.workspaceRoot
        profile: !!js ctx.loopManagedConfig.syncProfile
        hostSyncHome: !!js ctx.loopManagedConfig.syncHome
        clientSessionLabel: DeepSeek Harness
